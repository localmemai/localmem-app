name: Bug report
description: Something on the website is broken or wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For issues with the Localmem **product** (app, CLI, MCP), please file in
        [localmem-app](https://github.com/localmemai/localmem-app/issues) instead.
        This repo is just the website.
  - type: textarea
    id: what-happened
    attributes:
      label: What's wrong?
      description: What did you see, and what did you expect?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page / URL
      placeholder: e.g. https://localmem.ai/
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Safari
        - Chrome
        - Firefox
        - Edge
        - Other
  - type: input
    id: device
    attributes:
      label: Device / screen size
      placeholder: e.g. iPhone 15, or desktop 1440px
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image in if it's a visual issue.
