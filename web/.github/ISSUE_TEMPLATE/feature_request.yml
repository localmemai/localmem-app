name: Content or design suggestion
description: Suggest a change to the website's content or design
labels: [enhancement]
body:
  - type: textarea
    id: suggestion
    attributes:
      label: What would you change?
      description: The content, copy, or design change you're proposing.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What's the motivation or problem it addresses?
    validations:
      required: true
