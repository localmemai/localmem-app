name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out the sections
        below so we can reproduce and fix it quickly.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `localmem ...`
        2. ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - CLI (localmem)
        - MCP server (localmem-mcp)
        - App (localmem-app)
        - Setup / client registration
        - Not sure
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: AI client (if relevant)
      placeholder: Claude Code, Claude Desktop, Cursor, Codex, Antigravity…
  - type: input
    id: version
    attributes:
      label: Localmem version / commit
      placeholder: e.g. output of `localmem status`, or a git SHA
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      render: shell
