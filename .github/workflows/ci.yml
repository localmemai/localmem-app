name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    # Localmem needs Swift 6.2 / the macOS 26 SDK (see Package.swift). `macos-latest`
    # still ships Swift 6.1, so pin the macOS 26 image explicitly — it carries
    # Xcode 26 (Swift 6.2).
    runs-on: macos-26
    # Safety net: a stuck test should fail fast, not burn hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (Swift 6.2)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      # Cache resolved/compiled SwiftPM artifacts so runs don't re-download and
      # rebuild every dependency each time. Keyed on Package.resolved.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build
