name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    # Localmem needs Swift 6.2 / the macOS 26 SDK (see Package.swift). `macos-latest`
    # still ships Swift 6.1, so pin the macOS 26 image explicitly — it carries
    # Xcode 26 (Swift 6.2).
    runs-on: macos-26
    # Safety net: a stuck test should fail fast, not burn hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (Swift 6.2)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      # Cache resolved/compiled SwiftPM artifacts so runs don't re-download and
      # rebuild every dependency each time. Keyed on Package.resolved.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build --build-tests

      # Run each suite as its own step so a headless hang pinpoints the culprit
      # (the spinning step) instead of a single opaque "Test". Dropping
      # --skip-build also rules out the skip-build planning path as the cause.
      - name: Test — Core
        run: swift test --filter LocalmemCoreTests

      - name: Test — MCP
        run: swift test --filter LocalmemMCPTests

      # Serial so the ordered log pinpoints any hanging test, with a short
      # step timeout so a hang fails in minutes. (This suite passes in ~1s
      # locally under every stdin condition, so the hang is CI-specific.)
      - name: Test — CLI
        timeout-minutes: 6
        run: swift test --filter LocalmemTests --no-parallel

  legacy-macos:
    name: Build (no FoundationModels)
    # Localmem supports macOS 14/15 and Intel, where Apple's FoundationModels
    # framework is absent. GitHub's older-macOS runners don't ship Swift 6.2, so
    # we can't build on them directly. Instead we force the framework off on the
    # macos-26 runner via -DLOCALMEM_NO_FOUNDATION_MODELS, which compiles out the
    # exact same code the older SDK would (every FoundationModels/macOS-26 API is
    # behind `#if canImport(FoundationModels) && !LOCALMEM_NO_FOUNDATION_MODELS`).
    # This guards against an unguarded macOS-26 API breaking the older build.
    #
    # Compile-only (`--build-tests` builds test targets too): the flag removes
    # only the Apple backend, which no test exercises, so re-running the suite
    # here would add no behavioral coverage over the `build-test` job above.
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (Swift 6.2)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-legacy-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-legacy-

      - name: Build (FoundationModels disabled)
        run: swift build --build-tests -Xswiftc -DLOCALMEM_NO_FOUNDATION_MODELS
