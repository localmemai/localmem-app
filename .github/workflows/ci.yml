name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    # Localmem targets macOS 26 with the Swift 6.2 toolchain (see Package.swift),
    # so the runner image must ship that SDK. `macos-latest` tracks the newest
    # GitHub-hosted image; pin to a specific image (e.g. `macos-26`) once it is
    # available and stable in your org.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build
