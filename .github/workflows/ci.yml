name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    # Localmem targets macOS 26 (Package.swift) with the Swift 6.2 toolchain,
    # so it needs a runner image that ships that SDK. Switch to a pinned image
    # (e.g. macos-15) if the macOS 26 runner is unavailable in your org.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build
