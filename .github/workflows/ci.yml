name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    # Localmem targets macOS 26 with the Swift 6.2 toolchain (see Package.swift),
    # so the runner image must ship that SDK. `macos-latest` tracks the newest
    # GitHub-hosted image; pin to a specific image (e.g. `macos-26`) once it is
    # available and stable in your org.
    runs-on: macos-latest
    # Safety net: a stuck test should fail fast, not burn hours.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      # Cache resolved/compiled SwiftPM artifacts so runs don't re-download and
      # rebuild every dependency each time. Keyed on Package.resolved.
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build
