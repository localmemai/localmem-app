# CLA gate — every PR requires a one-time CLA signature (a PR comment).
# Signatures are recorded on the `cla-signatures` branch by the action.
# See CLA.md for the agreement text and LICENSING.md for why it exists.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA check
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "cla-signatures.json"
          path-to-document: "https://github.com/localmemai/localmem-app/blob/main/CLA.md"
          branch: "cla-signatures"
          # Maintainer and org-owned accounts are exempt — they already hold
          # the rights the CLA grants, so gating them on their own agreement is
          # circular. `claude` is the resolved co-author identity on
          # agent-assisted commits (Co-Authored-By: Claude <noreply@anthropic.com>).
          allowlist: "vedcoder,localmem-ai,claude,dependabot[bot]"
